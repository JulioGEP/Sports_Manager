name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, typecheck y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  migrations:
    name: migraciones al día con main
    # Solo tiene sentido en PR: compara la rama con main. En main no hay nada que comparar.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # La cabeza de la rama, no el merge que prepara GitHub: Netlify despliega la cabeza.
          ref: ${{ github.event.pull_request.head.sha }}
      - run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - run: bash scripts/check-migrations.sh origin/main

  isolation:
    name: aislamiento
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:isolation

  ui:
    name: interfaz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      # La web estática se sirve con `vite preview`, que reenvía /api a la API local en tiempo de ejecución.
      - run: pnpm --filter @sportsmanager/api build
      - run: pnpm --filter @sportsmanager/web build
      - run: pnpm test:ui
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-interfaz
          path: |
            apps/web/e2e/screenshots
            apps/web/playwright-report
          retention-days: 14
