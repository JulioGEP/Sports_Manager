# Un solo proyecto Netlify sirve la web y la API en el mismo host (ADR 0010).
# Base del proyecto: raíz del repo. La configuración vive aquí, no en la interfaz:
# el adaptador de Next.js se declara explícitamente porque Netlify no detecta el framework
# en la raíz de un monorepo, y localiza la app en apps/web gracias a `outputFileTracingRoot`
# en apps/web/next.config.ts. Ver docs/deploy.md.

[build]
  command = "pnpm build"
  publish = "apps/web/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "apps/api/netlify/functions"
  node_bundler = "esbuild"

# Desarrollo local: `pnpm dev` arranca Next en :3000, la función de la API y la base local,
# todo detrás de :8888. Sin shell: el comando no admite sintaxis de Bash.
[dev]
  command = "pnpm --filter @sportsmanager/web dev"
  targetPort = 3000
  port = 8888
  framework = "#custom"
  autoLaunch = false
