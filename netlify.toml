# Un solo proyecto Netlify sirve la web y la API en el mismo host (ADR 0010 y 0027).
# La web es una SPA estática (Vite) servida desde la CDN; `/api/*` lo atiende la función de la API.
# Base del proyecto: raíz del repo. Ver docs/deploy.md.

[build]
  command = "pnpm build"
  publish = "apps/web/dist"

[functions]
  directory = "apps/api/netlify/functions"
  node_bundler = "esbuild"

# Código, estilos, fuentes y diccionarios de la web (ADR 0060): llevan un hash en el nombre, así
# que nunca cambian; el navegador los guarda un año y no vuelve a preguntar por ellos. El
# index.html sigue sin caché: cada deploy apunta a ficheros nuevos.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# La API primero: las funciones se sirven en /api/* antes de caer en la SPA.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Todo lo demás es la SPA: el enrutador del navegador decide (clubes por ruta, /admin, acceso).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Desarrollo local: `pnpm dev` arranca Vite en :3000, esbuild en modo watch para la API, la función y la base local,
# todo detrás de :8888. Sin shell: el comando no admite sintaxis de Bash.
[dev]
  command = "pnpm run dev:servers"
  targetPort = 3000
  port = 8888
  framework = "#custom"
  autoLaunch = false
